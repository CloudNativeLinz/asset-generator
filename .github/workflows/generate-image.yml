name: Generate Image Artifact

on:
  repository_dispatch:
    types: [website-merged]

  workflow_dispatch:
    inputs:
      id:
        description: 'Event ID to use for --id (leave empty to generate all events)'
        required: false
        default: ''

  push:
    branches: [ main ]

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Generate image(s)
        run: |
          if [ -n "${{ github.event.inputs.id }}" ]; then
            echo "Generating image for event ID: ${{ github.event.inputs.id }}"
            imagegen generate \
              --template assets/templates/meetup.yaml \
              --id ${{ github.event.inputs.id }}
            imagegen generate \
              --template assets/templates/meetup.yaml \
              --id ${{ github.event.inputs.id }} --width 550
          else
            echo "Generating images for all events"
            imagegen generate \
              --template assets/templates/meetup.yaml
            echo "Generating images for all events with width 550"
            imagegen generate \
              --template assets/templates/meetup.yaml --width 550
          fi

      - name: Check for changes in artifacts and speaker images
        id: check_changes
        run: |
          git add artifacts/ assets/speaker-images/
          if git diff --cached --quiet; then
            echo "No changes detected in artifacts/ or assets/speaker-images/"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in artifacts/ or assets/speaker-images/"
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push generated images and speaker images
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -n "${{ github.event.inputs.id }}" ]; then
            git commit -m "Generate images and download speaker images for event ID: ${{ github.event.inputs.id }}"
          else
            git commit -m "Generate images and download speaker images for all events"
          fi
          git push

      - name: Upload image artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: generated-images
          path: |
            artifacts/
            assets/speaker-images/