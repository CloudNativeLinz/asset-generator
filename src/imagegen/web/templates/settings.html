<form id="settingsForm">
  <fieldset id="settingsFields" class="settings-fields stack" aria-label="Studio settings" disabled>
    <label>
      CTA Register
      <input id="ctaRegister" name="cta_register" type="text" />
    </label>

    <label>
      CTA Attend
      <input id="ctaAttend" name="cta_attend" type="text" />
    </label>

    <label>
      CTA Recap
      <input id="ctaRecap" name="cta_recap" type="text" />
    </label>

    <div class="grid-2">
      <label>
        Width (optional)
        <input id="width" name="width" type="number" min="320" step="1" placeholder="1080" />
      </label>
      <label>
        Image format
        <select id="imageFormat" name="image_format">
          <option value="jpg">jpg</option>
          <option value="png">png</option>
        </select>
      </label>
    </div>

    <label>
      Google Slides template URL or ID
      <input id="googleSlidesTemplate" name="google_slides_template" type="text" placeholder="https://docs.google.com/presentation/d/.../edit" />
    </label>

    <label>
      Website image repository (owner/name)
      <input id="githubRepo" name="github_repo" type="text" placeholder="CloudNativeLinz/go-image-generator" />
    </label>

    <div class="grid-2">
      <label>
        GitHub branch
        <input id="githubBranch" name="github_branch" type="text" placeholder="main" />
      </label>
      <label>
        Website image path
        <input id="githubPathPrefix" name="github_path_prefix" type="text" placeholder="artifacts" />
      </label>
    </div>
  </fieldset>

  <div class="inline-actions">
    <button id="btnSaveSettings" class="btn-primary" type="submit" disabled>Save Settings</button>
  </div>
  <p id="settingsStatus" class="status" role="status" aria-live="polite">Loading settings...</p>
</form>
