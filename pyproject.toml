[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagegen"
version = "0.1.0"
description = "Template-driven event image generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow==10.4.0",
  "PyYAML==6.0.2",
  "pydantic==2.8.2",
  "requests==2.32.3",
  "typer==0.12.5",
  "click==8.1.8",
  "fastapi==0.115.0",
  "uvicorn==0.51.0",
  "jinja2==3.1.4"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "ruff==0.6.5",
  "black==24.8.0"
]
animations = [
  "imageio==2.34.2",
  "imageio-ffmpeg==0.5.1",
  "numpy==1.26.4"
]

[project.scripts]
imagegen = "imagegen.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
