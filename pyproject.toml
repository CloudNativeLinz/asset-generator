[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagegen"
version = "0.1.0"
description = "Template-driven event image generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow==12.3.0",
  "PyYAML==6.0.3",
  "pydantic==2.13.5",
  "requests==2.34.2",
  "typer==0.27.2",
  "click==8.5.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "jinja2==3.1.6",
  "PyJWT[crypto]==2.13.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
  "black==26.5.1"
]
animations = [
  "imageio==2.37.4",
  "imageio-ffmpeg==0.6.0",
  "numpy==2.4.6"
]

[project.scripts]
imagegen = "imagegen.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"imagegen.web" = ["templates/*.html"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
