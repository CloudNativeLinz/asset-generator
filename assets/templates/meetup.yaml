name: meetup-default
background_color: "#FFFFFF"
size:
  width: 1920
  height: 1080
defaults:
  font: assets/fonts/LBRITE.TTF
  color: "#FFFFFF"
  size: 28

elements:
  - id: header_background
    type: rectangle
    box: { x: 0, y: 0, w: 1920, h: 340 }
    color: "#4355AD"

  - id: date
    type: text
    value: "{{ event.date | date('%d %b %Y') }}"
    box: { x: 380, y: 90, w: 1450, h: 70 }
    size: 52
    color: "#FFFFFF"
    align: left
    valign: top
    wrap: false

  - id: title
    type: text
    value: "{{ event.title }}"
    box: { x: 380, y: 165, w: 1450, h: 170 }
    size: 68
    color: "#FFFFFF"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: speaker1_photo
    type: image
    source: "{{ event.talks[0].image }}"
    box: { x: 320, y: 335, w: 310, h: 310 }
    shape: circle
    fit: cover

  - id: speaker1_talk
    type: text
    value: "{{ event.talks[0].title | default('') }}"
    box: { x: 640, y: 520, w: 390, h: 150 }
    size: 40
    color: "#000000"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: speaker1_name
    type: text
    value: "{{ event.talks[0].speaker | default('') }}"
    box: { x: 640, y: 680, w: 390, h: 85 }
    font: assets/fonts/LBRITED.TTF
    size: 32
    color: "#000000"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: speaker2_photo
    type: image
    source: "{{ event.talks[1].image | default('') }}"
    box: { x: 1100, y: 460, w: 310, h: 310 }
    shape: circle
    fit: cover

  - id: speaker2_talk
    type: text
    value: "{{ event.talks[1].title | default('') }}"
    box: { x: 1400, y: 690, w: 420, h: 150 }
    size: 40
    color: "#000000"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: speaker2_name
    type: text
    value: "{{ event.talks[1].speaker | default('') }}"
    box: { x: 1400, y: 850, w: 420, h: 85 }
    font: assets/fonts/LBRITED.TTF
    size: 32
    color: "#000000"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: host
    type: text
    value: "{{ event.host }}"
    box: { x: 98, y: 955, w: 610, h: 90 }
    size: 32
    color: "#000000"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: sponsor_logo
    type: image
    source: "{{ event.sponsor_logo | default('assets/sponsor-logos/' ~ (event.host | slug) ~ '.png') }}"
    box: { x: 1600, y: 980, w: 250, h: 80 }
    shape: rect
    fit: contain
