name: slide-cta
background_color: "#26272B"
size:
  width: 1920
  height: 1080
defaults:
  font: assets/fonts/Inter-Regular.ttf
  color: "#FFFFFF"
  size: 40

elements:
  - id: headline
    type: text
    value: "Join us on {{ event.date | date('%d %b %Y') }}"
    box: { x: 140, y: 300, w: 1640, h: 200 }
    font: assets/fonts/Inter-Bold.ttf
    size: 110
    color: "#FFFFFF"
    align: left
    valign: middle
    wrap: true
    fit: shrink

  - id: subline
    type: text
    value: "Reserve your spot and bring your questions."
    box: { x: 140, y: 540, w: 1640, h: 110 }
    size: 56
    color: "#FFFFFF"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: link
    type: text
    value: "{{ event.event_link | default('meetup.com/cloud-native-linz') }}"
    box: { x: 140, y: 700, w: 1640, h: 90 }
    size: 48
    color: "#FFFFFF"
    align: left
    valign: top
    wrap: false
    fit: shrink
