name: speaking-at
background: assets/backgrounds/SPEAKER-TEMPLATE.png
size:
  width: 1200
  height: 1200
defaults:
  font: assets/fonts/DejaVuSans.ttf
  color: "#000000"
  size: 28

elements:
  - id: speaker_cutout
    type: image
    source: >-
      {% if speaker_variant != 'portrait' %}{{ event.talks[talk_index].cutout | default(event.talks[talk_index].image) }}{% endif %}
    box: { x: 420, y: 130, w: 660, h: 763 }
    shape: rect
    fit: contain-bottom

  - id: speaker_portrait
    type: image
    source: >-
      {% if speaker_variant == 'portrait' %}{{ event.talks[talk_index].image | default('') }}{% elif speaker_variant == 'auto' and not event.talks[talk_index].cutout %}{{ event.talks[talk_index].image | default('') }}{% endif %}
    box: { x: 640, y: 350, w: 400, h: 440 }
    shape: rounded
    corner_radius: 24
    fit: cover

  - id: talk_title_background_top
    type: rectangle
    box: { x: 298, y: 803, w: 604, h: 89 }
    color: "#000000"

  - id: talk_title_background_bottom
    type: rectangle
    box: { x: 245, y: 892, w: 710, h: 93 }
    color: "#000000"

  - id: talk_title
    type: text
    value: "{{ event.talks[talk_index].title | default('Talk title coming soon') }}"
    box: { x: 315, y: 803, w: 570, h: 182 }
    font: assets/fonts/DejaVuSans-Bold.ttf
    size: 55
    color: "#FFFFFF"
    align: center
    valign: middle
    wrap: true
    fit: shrink
    line_spacing: 1.35

  - id: speaker_name
    type: text
    value: "{{ event.talks[talk_index].speaker | default('Guest speaker') }}"
    box: { x: 245, y: 1015, w: 710, h: 55 }
    font: assets/fonts/DejaVuSans-Bold.ttf
    size: 40
    color: "#000000"
    align: center
    valign: middle
    wrap: false
    fit: shrink

  - id: date_time
    type: text
    value: "📅  {{ event.date | date('%A, %B %d') }}{% if event.time %} | {{ event.time }}{% endif %}"
    box: { x: 120, y: 1077, w: 960, h: 38 }
    size: 26
    color: "#000000"
    align: center
    valign: middle
    wrap: false
    fit: shrink

  - id: host
    type: text
    value: >-
      📍  {{ event.address | default(event.host | default(event.venue)) }}
    box: { x: 120, y: 1118, w: 960, h: 38 }
    size: 26
    color: "#000000"
    align: center
    valign: middle
    wrap: false
    fit: shrink
