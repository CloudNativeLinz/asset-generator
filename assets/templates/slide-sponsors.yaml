name: slide-sponsors
background_color: "#26272B"
size:
  width: 1920
  height: 1080
defaults:
  font: assets/fonts/Inter-Regular.ttf
  color: "#FFFFFF"
  size: 40

elements:
  - id: heading
    type: text
    value: "Thanks to our sponsors"
    box: { x: 140, y: 160, w: 1640, h: 120 }
    font: assets/fonts/Inter-Bold.ttf
    size: 88
    color: "#FFFFFF"
    align: left
    valign: top
    wrap: true
    fit: shrink

  - id: logo_background
    type: rectangle
    box: { x: 140, y: 380, w: 1640, h: 300 }
    color: "#FFFFFF"

  - id: host_logo
    type: image
    source: "{{ event.sponsor_logo | default('assets/sponsor-logos/' ~ (event.host | slug) ~ '.png') }}"
    box: { x: 200, y: 420, w: 460, h: 220 }
    shape: rect
    fit: contain

  - id: sponsor1_logo
    type: image
    source: "{% if event.sponsors|length > 0 %}{{ event.sponsors[0].logo | default('') }}{% endif %}"
    box: { x: 740, y: 420, w: 460, h: 220 }
    shape: rect
    fit: contain

  - id: sponsor2_logo
    type: image
    source: "{% if event.sponsors|length > 1 %}{{ event.sponsors[1].logo | default('') }}{% endif %}"
    box: { x: 1280, y: 420, w: 460, h: 220 }
    shape: rect
    fit: contain

  - id: host_name
    type: text
    value: "Hosted by {{ event.host | default('Cloud Native Linz') }}"
    box: { x: 140, y: 760, w: 1640, h: 90 }
    size: 48
    color: "#FFFFFF"
    align: left
    valign: top
    wrap: false
    fit: shrink
